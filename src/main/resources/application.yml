spring:
  mvc:
    log-request-details: false
  application:
    name: deroyque-test
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deroyque}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  error:
    include-exception: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    org.springframework.security: INFO
  pattern:
    correlation: "[traceId=%X{traceId:-}] "

activation:
  security:
    issuer-uri: ${SECURITY_ISSUER_URI:}
    jwk-set-uri: ${SECURITY_JWK_SET_URI:}
    audience: ${SECURITY_AUDIENCE:}
  provider:
    authentication:
      token-file: ${PROVIDER_TOKEN_FILE:}
    base-url: ${PROVIDER_BASE_URL:http://localhost:8081}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
  processing:
    enabled: ${PROCESSING_ENABLED:true}
    max-attempts: ${PROCESSING_MAX_ATTEMPTS:3}
    retry-delay: ${PROCESSING_RETRY_DELAY:1s}
    processing-timeout: ${PROCESSING_TIMEOUT:60s}
    poll-interval: ${PROCESSING_POLL_INTERVAL:1s}
    recovery-interval: ${PROCESSING_RECOVERY_INTERVAL:5s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
